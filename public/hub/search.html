<body data-page="search" data-brand="chapterhive">

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <a class="af-brand" href="/hub" aria-label="Chapterhive, home">
      <img src="/images/chapterhive-mark.svg" alt="" width="34" height="34">
      <span>Chapter<b>hive</b></span>
    </a>
    <div class="header-actions">
      <div class="auth-area" id="auth-area"></div>
      <form class="header-search" action="/hub/search" method="get" role="search">
        <label class="sr-only" for="header-q">Search Chapterhive</label>
        <input type="search" id="header-q" name="q" placeholder="Search creators, works&hellip;" maxlength="80" autocomplete="off">
      </form>
      <button id="menu-toggle" class="btn btn-ghost btn-small menu-toggle" type="button"
              aria-expanded="false" aria-controls="site-menu" aria-label="Open menu">
        <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <button id="theme-toggle" class="btn btn-ghost btn-small" type="button">Light mode</button>
    </div>
  </header>

  <nav id="site-nav" class="site-nav" aria-label="Main navigation">
    <a href="/hub" data-nav="hub">Home</a>
    <a href="/hub/creators" data-nav="creators">Creators</a>
    <a href="/hub/top" data-nav="top">Top creators</a>
    <a href="/hub/feed" data-nav="feed">Following</a>
    <a href="/hub/news" data-nav="news">News &amp; updates</a>
    <a href="/hub/collabs" data-nav="collabs">Collabs</a>
    <a href="/hub/apply" data-nav="apply">Become a creator</a>
    <a href="/hub/sponsor" data-nav="sponsor">Sponsor</a>
  </nav>

  <main id="main">
    <section class="panel page-head">
      <p class="node-label">Search // results</p>
      <h1 class="glitch">Search</h1>
      <form id="search-form" class="search-big" action="/hub/search" method="get" role="search">
        <label for="search-q" class="sr-only">Search the site</label>
        <input type="search" id="search-q" name="q" maxlength="80" placeholder="Search creators, works, stories, characters, updates&hellip;">
        <button type="submit">Search</button>
      </form>
      <p id="search-summary" class="mono muted" aria-live="polite"></p>
    </section>
    <div id="search-results"></div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand"><img src="/images/chapterhive-mark.svg" alt="" width="28" height="28"> &copy; 2026 Chapterhive &middot; a <a href="/">God's Banditos</a> production</p>
    <p><a href="/legal/terms">Terms</a> &middot; <a href="/legal/privacy">Privacy</a> &middot; <a href="/legal/creator-agreement">Creator Agreement</a> &middot; <a href="/legal/content-rules">Content Rules</a> &middot; <a href="/contact">Contact</a></p>
  </footer>
