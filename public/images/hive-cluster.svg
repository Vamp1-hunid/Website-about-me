<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Decorative cluster of honeycomb cells for the Chapterhive home hero -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd96b"/>
      <stop offset="1" stop-color="#f29a0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6b40e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6b40e" stop-opacity="0"/>
    </radialGradient>
    <path id="c" d="M0 -46 L40 -23 L40 23 L0 46 L-40 23 L-40 -23 Z"/>
  </defs>
  <circle cx="220" cy="200" r="190" fill="url(#glow)"/>
  <g stroke="#f6b40e" stroke-width="2" fill="none" stroke-opacity="0.35">
    <use href="#c" x="140" y="131"/><use href="#c" x="300" y="131"/>
    <use href="#c" x="100" y="200"/><use href="#c" x="340" y="200"/>
    <use href="#c" x="140" y="269"/><use href="#c" x="300" y="269"/>
    <use href="#c" x="220" y="338"/><use href="#c" x="220" y="62"/>
  </g>
  <use href="#c" x="220" y="131" fill="url(#h)" opacity="0.95"/>
  <use href="#c" x="180" y="200" fill="#f6b40e" opacity="0.55"/>
  <use href="#c" x="260" y="200" fill="url(#h)" opacity="0.8"/>
  <use href="#c" x="220" y="269" fill="#f6b40e" opacity="0.35"/>
  <use href="#c" x="300" y="269" fill="#b9a4ff" opacity="0.35"/>
  <!-- a little open book in the brightest cell -->
  <g transform="translate(220 131)">
    <path d="M0 -10 C-6 -14 -13 -14 -18 -13 V12 C-13 11 -6 11 0 15 Z" fill="#1a1206"/>
    <path d="M0 -10 C6 -14 13 -14 18 -13 V12 C13 11 6 11 0 15 Z" fill="#2a1f12"/>
  </g>
</svg>
