<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chapterhive">
  <!-- Chapterhive mark: a honeycomb cell holding an open book, with a smaller cell beside it (the hive keeps growing) -->
  <defs>
    <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#f29a0b"/>
    </linearGradient>
  </defs>
  <path d="M28 4 L50 16.7 L50 42.1 L28 54.8 L6 42.1 L6 16.7 Z" fill="url(#honey)"/>
  <path d="M28 4 L50 16.7 L50 42.1 L28 54.8 L6 42.1 L6 16.7 Z" fill="none" stroke="#1a1208" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- open book -->
  <path d="M28 23.5 C23.5 20.5 18.5 20 14.5 21 V39 C18.5 38 23.5 38.5 28 41.5 Z" fill="#17110a"/>
  <path d="M28 23.5 C32.5 20.5 37.5 20 41.5 21 V39 C37.5 38 32.5 38.5 28 41.5 Z" fill="#2a1f12"/>
  <path d="M28 23.5 V41.5" stroke="#ffd25a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- small cell -->
  <path d="M52 44 L59 48 L59 56 L52 60 L45 56 L45 48 Z" fill="#ffd25a" stroke="#1a1208" stroke-opacity="0.3" stroke-width="1"/>
</svg>
